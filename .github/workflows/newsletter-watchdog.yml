name: Morning Mully - Newsletter delivery watchdog
on:
  schedule:
    - cron: '50 23 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  delivery:
    if: vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify both delivery records
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
        run: python3 automation/cloud_newsletter.py --live --watchdog >> "$GITHUB_STEP_SUMMARY"
      - name: Alert on missing delivery
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Newsletter delivery watchdog: incomplete publication';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            if (!issues.some(i => i.title === title)) {
              await github.rest.issues.create({...context.repo, title,
                body:`The independent end-of-day check could not confirm both newsletter deliveries.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nInspect the cloud newsletter workflow, date-specific manifest and Buffer. Do not clear pending intents or recreate posts blindly. Close this issue once resolved.`});
            }
