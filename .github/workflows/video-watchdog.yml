name: Morning Mully - Video delivery watchdog
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: morning-mully-video-watchdog
  cancel-in-progress: false
jobs:
  delivery:
    if: vars.PUBLISHING_ENABLED == 'true' && vars.VIDEO_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            automation
            data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delivery, coverage, channels and remaining stock
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 automation/video_watchdog.py >> "$GITHUB_STEP_SUMMARY"
      - name: Maintain one actionable alert
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Video publishing needs attention';
            const path = '/tmp/morning-mully-video-health.json';
            let report;
            try { report = JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch { report = {healthy:false, issues:['The independent video health check could not complete. Inspect the workflow logs.']}; }
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (report.healthy) {
              if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, state:'closed'});
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `@claudecodeguy Video publishing needs attention.\n\n${report.issues.map(x => '- '+x).join('\n')}\n\nCheck: ${report.checked_at || 'unavailable'}\nRun: ${run}\n\nThis monitor never deletes, reschedules or recreates posts. Resolve uncertain writes by checking Buffer and the ledger first. This alert closes automatically after all checks pass.`;
            if (existing) {
              await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body, assignees:['claudecodeguy']});
            }
